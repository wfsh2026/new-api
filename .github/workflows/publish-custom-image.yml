name: Temporary GPT-6 deployment
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        options: [inspect, deploy]
        default: inspect
      image:
        type: string
        default: ghcr.io/wfsh2026/new-api:sha-5d5c98b
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository == 'wfsh2026/new-api'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Connect with temporary Lightsail SSH credentials
        env:
          SSH_KEY: ${{ secrets.GPT6_DEPLOY_SSH_KEY }}
          SSH_CERT: ${{ secrets.GPT6_DEPLOY_SSH_CERT }}
          SSH_HOSTS: ${{ secrets.GPT6_DEPLOY_KNOWN_HOSTS }}
          OPERATION: ${{ inputs.operation }}
          DEPLOY_IMAGE: ${{ inputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_IMAGE" =~ ^ghcr.io/wfsh2026/new-api:sha-[a-f0-9]{7}$ ]]
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          umask 077
          printf '%s\n' "$SSH_KEY" > "$work/key"
          printf '%s\n' "$SSH_CERT" > "$work/key-cert.pub"
          printf '%s\n' "$SSH_HOSTS" > "$work/known_hosts"
          unset SSH_KEY SSH_CERT SSH_HOSTS
          ssh -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$work/known_hosts" -i "$work/key" ubuntu@52.77.104.58 "bash -s -- '$OPERATION' '$DEPLOY_IMAGE'" < .github/scripts/deploy-gpt6.sh
